name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run API tests
        id: api
        run: npm run test:api
        continue-on-error: true

      - name: Run browser tests
        id: browser
        run: npx playwright test --project=desktop --project=mobile
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Set result summary
        if: always()
        id: summary
        run: |
          API="${{ steps.api.outcome }}"
          BROWSER="${{ steps.browser.outcome }}"
          if [ "$API" = "success" ] && [ "$BROWSER" = "success" ]; then
            echo "icon=:white_check_mark:" >> $GITHUB_OUTPUT
            echo "status=All tests passed" >> $GITHUB_OUTPUT
          else
            echo "icon=:x:" >> $GITHUB_OUTPUT
            PARTS=()
            [ "$API" != "success" ] && PARTS+=("API")
            [ "$BROWSER" != "success" ] && PARTS+=("browser")
            echo "status=Failures in: $(IFS=', '; echo "${PARTS[*]}")" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.summary.outputs.icon }} *Market Street — ${{ steps.summary.outputs.status }}*\n*Branch:* `${{ github.ref_name }}`  *Triggered by:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
