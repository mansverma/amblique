name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run API tests
        id: api
        run: npm run test:api
        continue-on-error: true

      - name: Run browser tests
        id: browser
        run: npx playwright test --project=desktop --project=mobile
        continue-on-error: true

      - name: Generate defect report summary
        if: always()
        run: |
          node - <<'EOF'
          const fs   = require('fs');
          const path = require('path');

          const resultsFile = 'test-results/results.json';
          if (!fs.existsSync(resultsFile)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '> No test results found.\n');
            process.exit(0);
          }

          const results = JSON.parse(fs.readFileSync(resultsFile, 'utf8'));
          const suites  = results.suites ?? [];

          let passed = 0, failed = 0, skipped = 0;
          const failures = [];

          function walk(suite, project) {
            const proj = suite.project ?? project ?? '';
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                const status = test.results?.[0]?.status ?? 'skipped';
                if (status === 'passed')  passed++;
                else if (status === 'skipped') skipped++;
                else {
                  failed++;
                  failures.push({ project: proj, title: spec.title, suite: suite.title });
                }
              }
            }
            for (const child of suite.suites ?? []) walk(child, proj);
          }
          for (const s of suites) walk(s, s.project ?? '');

          const total  = passed + failed + skipped;
          const icon   = failed === 0 ? '✅' : '❌';
          const lines  = [];

          lines.push(`## ${icon} Market Street — Test Results`);
          lines.push('');
          lines.push(`| Total | Passed | Failed | Skipped |`);
          lines.push(`|-------|--------|--------|---------|`);
          lines.push(`| ${total} | ${passed} | ${failed} | ${skipped} |`);
          lines.push('');

          if (failures.length > 0) {
            lines.push('### ❌ Failing Tests');
            lines.push('');
            lines.push('| Project | Suite | Test |');
            lines.push('|---------|-------|------|');
            for (const f of failures) {
              lines.push(`| \`${f.project}\` | ${f.suite} | ${f.title} |`);
            }
            lines.push('');
          } else {
            lines.push('### ✅ All tests passed');
            lines.push('');
          }

          lines.push(`> 📊 [Full Allure report](https://mansverma.github.io/amblique)`);

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          EOF

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - name: Set result summary
        if: always()
        id: summary
        run: |
          API="${{ steps.api.outcome }}"
          BROWSER="${{ steps.browser.outcome }}"
          if [ "$API" = "success" ] && [ "$BROWSER" = "success" ]; then
            echo "icon=:white_check_mark:" >> $GITHUB_OUTPUT
            echo "status=All tests passed" >> $GITHUB_OUTPUT
          else
            echo "icon=:x:" >> $GITHUB_OUTPUT
            PARTS=()
            [ "$API" != "success" ] && PARTS+=("API")
            [ "$BROWSER" != "success" ] && PARTS+=("browser")
            echo "status=Failures in: $(IFS=', '; echo "${PARTS[*]}")" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.summary.outputs.icon }} *Market Street — ${{ steps.summary.outputs.status }}*\n*Branch:* `${{ github.ref_name }}`  *Triggered by:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Allure report" },
                      "url": "https://mansverma.github.io/amblique"
                    }
                  ]
                }
              ]
            }
